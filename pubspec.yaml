name: civicapp
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.0.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  geolocator: ^10.1.0
  video_player: ^2.9.1
  path_provider: ^2.1.4
  pdf: ^3.11.1
  open_file: ^3.5.3
  http: ^1.2.2
  geocoding: ^2.2.0
  printing: ^5.13.4
  firebase_core: ^3.2.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - web/icons/Icon-192.png
    - assets/images/
    - assets/images/pole image.webp
    - assets/images/water leak image.jpeg
    - assets/images/2ndroadimadge.jpg